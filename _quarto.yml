project:
  type: manuscript

manuscript:
  article: index.qmd
  # Set explicitly so Quarto does not query GitHub (git ls-remote) on every
  # render; that query fails, and aborts the render, when offline. Same value
  # Quarto would derive from the origin remote.
  manuscript-url: https://ondrej-such.github.io/ams/

profile:
  default: full

number-sections: true

format:
  html:
    comments:
      hypothesis: true
  docx: default
  jats: default

  pdf:
    template-partials:
      - title.tex
    include-in-header:
      text: |
        \usepackage{tikz}

execute:
  freeze: true

editor: visual

